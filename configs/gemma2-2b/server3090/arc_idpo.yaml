seed: 42
run_name: gemma2-2b-arc-3090-idpo
dataset_type: arc
dataset_path: allenai/ai2_arc
dataset_split: train
base_model_path: google/gemma-2-2b-it
reward_model_path: google/gemma-2-2b-it
merge_system_into_user: true

alice:
  name: Alice
  served_model_name: alice
  url: http://127.0.0.1:8100/v1/chat/completions
  initial_model_path: checkpoints/gemma2-2b-arc-3090-isft/alice/iteration_0
  checkpoint_root: checkpoints/gemma2-2b-arc-3090-idpo/alice
bob:
  name: Bob
  served_model_name: bob
  url: http://127.0.0.1:8101/v1/chat/completions
  initial_model_path: checkpoints/gemma2-2b-arc-3090-isft/bob/iteration_0
  checkpoint_root: checkpoints/gemma2-2b-arc-3090-idpo/bob

sample_count: 50
explore_count: 8
max_round: 8
max_tokens_per_turn: 256
iteration_times: 1
lambda1: -0.5
lambda2: 0.6
cal_ppl: true
from_initial: true
prompt_pool_path: utils/prompts_arc_first.jsonl
require_name_prefix: true
temperature: 0.7
runs_root: runs
thread_count: 2
scorer_batch_size: 2
scorer_device: cuda:0
health_check_timeout: 300
release_vllm_before_scoring: true

dpo:
  min_value: 0.45
  min_reward_gap: 0.2
  beta: 0.1
  learning_rate: 5.0e-7
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_length: 1536
  max_prompt_length: 1280
  bf16: false
  fp16: true
  gradient_checkpointing: true
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  logging_steps: 1
  report_to: none
  train_ratio: 0.9

